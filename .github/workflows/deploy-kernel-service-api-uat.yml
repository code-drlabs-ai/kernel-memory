# ===================================================================
# GITHUB ACTIONS WORKFLOW: KERNEL MEMORY SERVICE API - UAT DEPLOYMENT
#
# PURPOSE:
# This CI/CD pipeline builds and deploys the Kernel Memory Service API
# from the 'kernel-memory' repository to its Azure App Service in the
# UAT environment.  
#
# SECURITY & BEST PRACTICES:
#   - Uses OIDC (OpenID Connect) for passwordless Azure authentication.
#   - Authenticates to a private GitHub NuGet feed securely using
#     a Personal Access Token (PAT) stored in GitHub Secrets.
#   - Avoids storing any secrets in source control.
#   - Keeps build and deploy jobs separate for cleaner artifacts.
# ===================================================================

name: Deploy Kernel Service API to UAT

# -------------------------------------------------------------------
# TRIGGERS
# -------------------------------------------------------------------
on:
  push:
    branches:
      - main
  workflow_dispatch:

# -------------------------------------------------------------------
# PERMISSIONS
# -------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

# -------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# -------------------------------------------------------------------
env:
  AZURE_WEBAPP_NAME: 'convers-uat-kernel-service-api-app-cmjuaknlob7cc' # Target Azure App Service (UAT)
  AZURE_RESOURCE_GROUP: 'convers-uat-rg'                                 # Resource group name
  DOTNET_VERSION: '8.0.x'                                               # .NET SDK version
  SOURCE_DIRECTORY: '.'                                                 # Root path of the project
  PRIVATE_NUGET_FEED: 'https://nuget.pkg.github.com/code-drlabs-ai/index.json' # Private feed URL
  GITHUB_NUGET_USER: 'code-drlabs-ai'                                   # GitHub org/user for NuGet feed

# -------------------------------------------------------------------
# JOBS
# -------------------------------------------------------------------
jobs:

  # -----------------------------------------------------------------
  # JOB: BUILD
  # -----------------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # STEP 1: Checkout source code
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Remove local NuGet.Config to avoid invalid credentials
        run: rm -f ./service/Core/NuGet.Config  

      # ---------------------------
      # STEP 2: Install .NET SDK
      # ---------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ---------------------------
      # STEP 3: Configure NuGet (Private Feed)
      # ---------------------------
      - name: Add private NuGet source
        run: |
          dotnet nuget add source "${{ env.PRIVATE_NUGET_FEED }}" \
            --name "github" \
            --username "${{ env.GITHUB_NUGET_USER }}" \
            --password "${{ secrets.NUGET_PAT }}" \
            --store-password-in-clear-text
            
          dotnet nuget list source

      # ---------------------------
      # STEP 4: Restore dependencies
      # ---------------------------
      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOURCE_DIRECTORY }} --configfile nuget.config

      # ---------------------------
      # STEP 5: Build & Publish
      # ---------------------------
      - name: Build and publish application
        run: dotnet publish ${{ env.SOURCE_DIRECTORY }} --configuration Release --output ./publish

      # ---------------------------
      # STEP 6: Save build artifacts
      # ---------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app-kernel-service
          path: ./publish

  # -----------------------------------------------------------------
  # JOB: DEPLOY
  # -----------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: 'UAT'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      # ---------------------------
      # STEP 1: Download build output
      # ---------------------------
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app-kernel-service

      # ---------------------------
      # STEP 2: Login to Azure using OIDC
      # ---------------------------
      - name: Azure CLI login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------
      # STEP 3: Set environment variables in Azure App Service
      # ---------------------------
      - name: Set ASP.NET Core environment variable
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings "ASPNETCORE_ENVIRONMENT=Staging"

      # ---------------------------
      # STEP 4: Deploy to Azure App Service
      # ---------------------------
      - name: Deploy to Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      # ---------------------------
      # STEP 5: Cleanup Azure CLI session
      # ---------------------------
      - name: Azure CLI logout
        run: |
          az logout
          az cache purge
          az account clear
