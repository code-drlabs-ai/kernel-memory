# ===================================================================
# GITHUB ACTIONS WORKFLOW: KERNEL SERVICE API - COMBINED JOB (WORKAROUND)
#
# PURPOSE:
# This pipeline builds and deploys the Kernel Service API in a single job
# per environment. This is a workaround to bypass GitHub Actions
# artifact storage quota issues.
# ===================================================================

name: Deploy Kernel Service API (Combined Job)

# --- TRIGGERS ---
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'service/Service/**'
  workflow_dispatch:

# --- PERMISSIONS ---
permissions:
  id-token: write
  contents: read

# --- ENVIRONMENT VARIABLES (GLOBAL) ---
env:
  DOTNET_VERSION: '8.0.x'
  SOURCE_DIRECTORY: 'service/Service'
  PRIVATE_NUGET_FEED: 'https://nuget.pkg.github.com/code-drlabs-ai/index.json'
  GITHUB_NUGET_USER: 'code-drlabs-ai'

# --- JOBS ---
jobs:
  # ===================================================================
  # JOB: BUILD AND DEPLOY TO DEV
  # ===================================================================
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    environment:
      name: 'DEV'

    env:
      AZURE_WEBAPP_NAME: 'certainty-ai-kernel-service-api-3yf' # <-- Confirm DEV App Service Name
      AZURE_RESOURCE_GROUP: 'rg.certainty.ai' # <-- Confirm DEV Resource Group

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add private NuGet source
        run: |
          dotnet nuget add source "${{ env.PRIVATE_NUGET_FEED }}" --name "github" --username "${{ env.GITHUB_NUGET_USER }}" --password "${{ secrets.NUGET_PAT }}" --store-password-in-clear-text

      - name: Build and publish application
        run: dotnet publish ${{ env.SOURCE_DIRECTORY }} --configuration Release --output ./publish --no-restore

      - name: Azure CLI login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set ASP.NET Core environment variable
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings "ASPNETCORE_ENVIRONMENT=Development"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

  # ===================================================================
  # JOB: BUILD AND DEPLOY TO UAT
  # ===================================================================
  build-and-deploy-uat:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: 'UAT'

    env:
      AZURE_WEBAPP_NAME: 'convers-uat-kernel-service-api-app-cmjuaknlob7cc'
      AZURE_RESOURCE_GROUP: 'convers-uat-rg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add private NuGet source
        run: |
          dotnet nuget add source "${{ env.PRIVATE_NUGET_FEED }}" --name "github" --username "${{ env.GITHUB_NUGET_USER }}" --password "${{ secrets.NUGET_PAT }}" --store-password-in-clear-text

      - name: Build and publish application
        run: dotnet publish ${{ env.SOURCE_DIRECTORY }} --configuration Release --output ./publish --no-restore

      - name: Azure CLI login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set ASP.NET Core environment variable
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings "ASPNETCORE_ENVIRONMENT=Staging"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

  # ===================================================================
  # JOB: BUILD AND DEPLOY TO PROD
  # ===================================================================
  build-and-deploy-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    environment:
      name: 'PROD'

    env:
      AZURE_WEBAPP_NAME: 'convers-prod-kernel-service-api-app-...' # <-- REPLACE with PROD App Service Name
      AZURE_RESOURCE_GROUP: 'convers-prod-rg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add private NuGet source
        run: |
          dotnet nuget add source "${{ env.PRIVATE_NUGET_FEED }}" --name "github" --username "${{ env.GITHUB_NUGET_USER }}" --password "${{ secrets.NUGET_PAT }}" --store-password-in-clear-text
          
      - name: Build and publish application
        run: dotnet publish ${{ env.SOURCE_DIRECTORY }} --configuration Release --output ./publish --no-restore

      - name: Azure CLI login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set ASP.NET Core environment variable
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings "ASPNETCORE_ENVIRONMENT=Production"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
